# Final runs on ml-1m, generated by `seqrec final-plan` from the studies of
# m3-tune-ml-1m with 10 leave-one-out seeds (METHODS 5.5, 7.5). The first
# 20 runs are the time-to-target group of METHODS 9.4, trained on one Pod.
batch = "m3-final-ml-1m"
warmup_s = 180
order = "listed"

[defaults]
dataset = "ml-1m"
split = "loo"
phase = "final"

[[runs]]
arm = "sasrec-ss"
seed = 1
params = { blocks = 2, dim = 256, dropout = 0.2553119917057942, heads = 2, lr = 0.00016872304848410295, negatives = 1024, shared_output = true, weight_decay = 0.0 }

[[runs]]
arm = "gsasrec"
seed = 1
max_epochs = 600
patience = 60
start_limit = 600
guard_hours = 16.0
params = { blocks = 2, dim = 128, dropout = 0.2168511641771855, heads = 1, lr = 0.0016360372762336108, negatives = 128, shared_output = true, t = 0.9093022319517575, weight_decay = 0.0 }

