# M2 pilot (METHODS 7.5, 12; D026). No test data are read.
# 1. Seed variance on MovieLens-1M: the anchor configurations under the METHODS 5.2 caps,
#    seeds 1 to 3 (tag "sigma"); A3 uses the A2 configuration with K = 256.
# 2. Floor baselines on MovieLens-1M, validation only (tag "floor").
# 3. Epoch time on every dataset: 2 epochs, each with full validation, at the anchor size
#    (tag "time-small") and at the largest size of the search space (tag "time-large").
batch = "m2-pilot"
warmup_s = 180
order = "listed"

[defaults]
split = "loo"
phase = "tune"

[[runs]]
dataset = "ml-1m"
arm = "sasrec-bce"
seeds = [1, 2, 3]
tag = "sigma"
params = { lr = 0.001, dim = 64, blocks = 2, heads = 1, dropout = 0.1, weight_decay = 0.0, shared_output = true }

[[runs]]
dataset = "ml-1m"
arm = "sasrec-ce"
seeds = [1, 2, 3]
tag = "sigma"
params = { lr = 0.001, dim = 64, blocks = 2, heads = 1, dropout = 0.1, weight_decay = 0.0, shared_output = true }

[[runs]]
dataset = "ml-1m"
arm = "sasrec-ss"
seeds = [1, 2, 3]
tag = "sigma"
params = { lr = 0.001, dim = 64, blocks = 2, heads = 1, dropout = 0.1, weight_decay = 0.0, shared_output = true, negatives = 256 }

[[runs]]
dataset = "ml-1m"
arm = "gsasrec"
seeds = [1, 2, 3]
tag = "sigma"
params = { lr = 0.001, dim = 128, blocks = 2, heads = 1, dropout = 0.5, weight_decay = 0.0, shared_output = false, negatives = 256, t = 0.75 }

[[runs]]
dataset = "ml-1m"
arm = "bert4rec"
seeds = [1, 2, 3]
tag = "sigma"
params = { lr = 0.001, dim = 64, blocks = 2, heads = 2, dropout = 0.1, weight_decay = 0.0, mask_prob = 0.2 }

[[runs]]
dataset = "ml-1m"
arm = "mostpop"
seeds = [0]
tag = "floor"

[[runs]]
dataset = "ml-1m"
arm = "transition"
seeds = [0]
tag = "floor"

[[runs]]
dataset = "ml-1m"
arm = "sasrec-bce"
seeds = [0]
tag = "time-small"
max_epochs = 2
patience = 2
