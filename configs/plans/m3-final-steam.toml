# Final runs on steam, generated by `seqrec final-plan` from the studies of
# m3-tune-steam with 5 leave-one-out seeds (METHODS 5.5, 7.5). The first
# 20 runs are the time-to-target group of METHODS 9.4, trained on one Pod.
batch = "m3-final-steam"
warmup_s = 180
order = "listed"

[defaults]
dataset = "steam"
split = "loo"
phase = "final"

[[runs]]
arm = "sasrec-bce"
seed = 1
max_epochs = 600
patience = 60
start_limit = 600
guard_hours = 16.0
params = { blocks = 2, dim = 64, dropout = 0.3147437061636741, heads = 1, lr = 0.0002453963697801768, shared_output = true, weight_decay = 0.0 }

