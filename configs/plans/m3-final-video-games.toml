# Final runs on video-games, generated by `seqrec final-plan` from the studies of
# m3-tune-video-games with 5 leave-one-out seeds (METHODS 5.5, 7.5). The first
# 20 runs are the time-to-target group of METHODS 9.4, trained on one Pod.
batch = "m3-final-video-games"
warmup_s = 180
order = "listed"

[defaults]
dataset = "video-games"
split = "loo"
phase = "final"

[[runs]]
arm = "gsasrec"
seed = 1
max_epochs = 600
patience = 60
start_limit = 600
guard_hours = 16.0
params = { blocks = 3, dim = 64, dropout = 0.3604933000691118, heads = 2, lr = 0.000329020457007634, negatives = 128, shared_output = true, t = 0.9465243691836827, weight_decay = 0.0 }

