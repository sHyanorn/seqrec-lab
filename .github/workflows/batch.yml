name: batch

# Manual runs only: nothing here is triggered by pushes or pull requests.
on:
  workflow_dispatch:
    inputs:
      extra:
        description: torch build to install
        type: choice
        options: [cpu]
        default: cpu

permissions:
  contents: write # the batch job commits aggregate CSVs
  statuses: write # progress of a running job, readable while it runs

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync
        run: uv sync --locked --extra "${{ inputs.extra }}"
      - name: Environment
        run: |
          uv run --no-sync python -c "import sys, torch; print(sys.version); print(torch.__version__, torch.cuda.is_available())"
          if command -v nvidia-smi >/dev/null; then nvidia-smi; else echo "nvidia-smi: not found"; fi
      - name: Tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=batch/progress -f description="tests started" --silent
          uv run --no-sync pytest -q
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=batch/progress -f description="tests finished" --silent
      - name: Push access (dry run)
        run: git push --dry-run origin HEAD:main
