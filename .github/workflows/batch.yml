name: batch

# Manual runs only: nothing here is triggered by pushes or pull requests.
on:
  workflow_dispatch:
    inputs:
      task:
        description: what to do
        type: choice
        options: [setup, profile, run, tune, test, export]
        default: run
      plan:
        description: plan file name in configs/plans (run, tune, test, export)
        type: string
      hours:
        description: stop the plan after this many hours, 1 to 22 (run, tune)
        type: number
        default: 22
      profile_args:
        description: profile_step.py arguments (profile)
        type: string
      repeats:
        description: profile repetitions, one process each
        type: number
        default: 5
      stop:
        description: delete the machine when the job ends
        type: boolean
        default: true

permissions:
  contents: write # the job commits aggregate CSVs and environment reports
  statuses: write # progress of a running job; its log is readable only after it ends

concurrency:
  group: batch # one job at a time on the machine
  queue: max # later jobs wait their turn instead of replacing the one already waiting

env:
  # Everything that must outlive the machine is on the network volume, outside the checkout.
  SEQREC_HOME: /workspace/seqrec
  UV_PROJECT_ENVIRONMENT: /workspace/seqrec/venv
  UV_CACHE_DIR: /workspace/seqrec/uv-cache
  UV_PYTHON_INSTALL_DIR: /workspace/seqrec/uv-python
  STOP_REQUEST: /run/seqrec-stop-request # on the container disk: gone with the machine
  MACHINE: gpu
  TASK: ${{ inputs.task }}
  PLAN: ${{ inputs.plan }}
  HOURS: ${{ inputs.hours }}
  PROFILE_ARGS: ${{ inputs.profile_args }}
  REPEATS: ${{ inputs.repeats }}

jobs:
  batch:
    if: github.ref == 'refs/heads/main' # a guard against a mistaken ref, checked before the machine is touched
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 1380 # the job token lasts 24 hours; the push must happen before that
    steps:
      - name: Claim the machine
        run: |
          rm -f "$STOP_REQUEST" # a request left by the job before this one
          echo "$SEQREC_HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token is given to single steps, never to the code under test
      - name: Watchdog
        run: bash scripts/cloud/batch_steps.sh watchdog-running
      - name: Check inputs
        run: bash scripts/cloud/batch_steps.sh check-inputs
      - name: Sync
        timeout-minutes: 30
        run: uv sync --locked --extra cu132
      # A batch file on main that records a test read this volume lacks was exported from
      # another volume. Until it is moved to results/<name>/ that read is in no count (D045),
      # so the job stops here, before any GPU work.
      - name: Recorded test reads (on failure, move results/runs/* to results/<name>/)
        if: contains(fromJSON('["run", "tune", "test", "export"]'), inputs.task)
        run: uv run --no-sync seqrec export --check-reads --runs-dir "$SEQREC_HOME/runs"
      - name: Machine
        run: bash scripts/cloud/batch_steps.sh machine
      - name: Report start
        if: contains(fromJSON('["setup", "profile", "export"]'), inputs.task)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cloud/batch_steps.sh status pending "$TASK started on $MACHINE"
      - name: Setup
        id: setup
        if: inputs.task == 'setup'
        timeout-minutes: 240
        run: |
          uv run --no-sync pytest -q
          uv run --no-sync seqrec data prepare --data-dir "$SEQREC_HOME/data"
          bash scripts/cloud/batch_steps.sh data-unchanged
          uv run --no-sync python scripts/check_env.py
      - name: Commit the environment report
        if: steps.setup.outcome == 'success'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          bash scripts/cloud/batch_steps.sh commit
          "chore(env): add the check_env report of machine $MACHINE" results/env
      - name: Profile
        if: inputs.task == 'profile'
        timeout-minutes: 120
        run: bash scripts/cloud/batch_steps.sh profile
      # An export that already fails (a test read left incomplete) would fail again after the
      # plan; better before hours of training than after.
      - name: Export check
        if: contains(fromJSON('["run", "tune", "test"]'), inputs.task)
        timeout-minutes: 30
        run: uv run --no-sync seqrec export --runs-dir "$SEQREC_HOME/runs" --out-dir "$RUNNER_TEMP/export-check"
      - name: Plan
        id: plan
        if: contains(fromJSON('["run", "tune", "test"]'), inputs.task)
        env:
          GH_TOKEN: ${{ github.token }} # for progress statuses; removed from the plan's own environment
        run: bash scripts/cloud/batch_steps.sh plan
      # Results are committed only when the plan step succeeded. After a failure, a
      # cancellation or a timeout the runs stay on the volume and the same job resumes them.
      # The export task is for a batch whose plan cannot succeed any more (a run given up
      # after repeated failures). It fails while any run of the plan is neither trained nor
      # given up.
      - name: Export
        if: steps.plan.outcome == 'success' || inputs.task == 'export'
        timeout-minutes: 30
        run: bash scripts/cloud/batch_steps.sh export
      # This batch's file, and the summaries computed from every batch file on main.
      - name: Commit results
        if: steps.plan.outcome == 'success' || inputs.task == 'export'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cloud/batch_steps.sh results
      - name: Report end
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ "$JOB_STATUS" = success ] && state=success || state=failure
          bash scripts/cloud/batch_steps.sh status "$state" "$TASK ${PLAN%.toml} on $MACHINE ended: $JOB_STATUS"
      - name: Request stop
        if: always() && inputs.stop
        run: touch "$STOP_REQUEST" # pod_start.sh deletes the machine once the job has reported
